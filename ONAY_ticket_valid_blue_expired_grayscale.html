/* Карта бетіндегі төменгі ақ панель: берілген 3 фотоға сәйкес. */
#cards-peek-sheet.cards-peek-sheet{
  box-sizing:border-box;position:absolute;bottom:65px;left:0;right:0;
  z-index:24;width:100%;height:101px;
  min-height:0;padding:0;background:#fff;border-radius:31px 31px 0 0;
  display:flex;flex-direction:column;overflow:hidden;pointer-events:auto;
  box-shadow:0 -1px 1px rgba(10,12,22,.045);transition:height .3s ease, border-radius .3s ease;
}
#cards-peek-sheet.cards-peek-sheet.expanded{
  top:var(--cards-header-height,56px);bottom:65px;height:auto;border-radius:31px 31px 0 0;
}
#cards-peek-sheet .cards-feed-pull{
  height:42px;min-height:42px;flex:0 0 42px;width:100%;
  display:flex;justify-content:center;align-items:flex-start;padding:11px 0 0;
  border:0;background:white;cursor:pointer;touch-action:none;
}
#cards-peek-sheet .cards-peek-grabber{width:84px;height:5px;border-radius:50px;background:#e1e5ec;margin:0;display:block;}
#cards-peek-sheet .cards-feed-scroll{
  box-sizing:border-box;flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:0 15px 14px;background:#fff;
}
#cards-peek-sheet:not(.expanded) .cards-feed-scroll{overflow:hidden;pointer-events:none;}
#cards-peek-sheet .cards-feed-scroll::-webkit-scrollbar{display:none;}
#cards-peek-sheet .onay-feed-item{margin:0 0 9px;width:100%;border-radius:15px;overflow:hidden;line-height:0;background:#fff;}
#cards-peek-sheet .onay-feed-item img{display:block;width:100%;height:auto;aspect-ratio:655 / 329;object-fit:fill;border-radius:15px;}
#page-main.show-other #cards-peek-sheet{display:none;}
@media(max-height:600px){#cards-peek-sheet.cards-peek-sheet{height:76px}#cards-peek-sheet.cards-peek-sheet.expanded{height:auto}}

/* Айлық абонемент: жоғарғы тұтқаны басып төмен тартқанда жабу. */
#page-monthly-pass .monthly-handle{
  cursor:grab;width:96px;height:6px;margin:0 auto 32px;
  background:#dfe3eb;touch-action:none;position:relative;z-index:3;
}
#page-monthly-pass .monthly-handle::before{
  content:'';position:absolute;left:-100px;right:-100px;top:-12px;bottom:-12px;
}
#page-monthly-pass .monthly-topbar{touch-action:pan-x;}
#page-monthly-pass .monthly-sheet.dragging{transition:none!important;}
#page-monthly-pass .monthly-sheet.drag-return{transition:transform .23s ease!important;}
#page-monthly-pass .monthly-overlay{overscroll-behavior:contain;}

/* Жарнама парағы ашық тұрғанда жабу тұтқасы барлық жағдайда басылады. */
#cards-peek-sheet .cards-feed-pull{position:relative;z-index:3;-webkit-user-select:none;user-select:none;}
#cards-peek-sheet.expanded .cards-feed-pull{height:52px;flex-basis:52px;min-height:52px;}
#cards-peek-sheet .cards-feed-scroll{touch-action:pan-y;}
#cards-peek-sheet.expanded{overscroll-behavior:contain;}

<style id="cards-and-routes-tab-animation">
  /* Cards tab highlight: a compact yellow circle and a short card-stack tilt. */
  #page-main .onay-nav-card-icon{
    background:#ffda00!important;
    border-radius:50%!important;
    transition:transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s ease;
  }
  #page-main .onay-nav-card-icon.is-animating{
    animation:onayTabPop .48s cubic-bezier(.2,.8,.2,1) both;
  }
  #page-main .onay-nav-card-icon.is-animating .nav-icon-cards{
    animation:onayCardTilt .48s cubic-bezier(.2,.8,.2,1) both;
    transform-origin:50% 50%;
  }

  /* In the Routes screen the yellow selection moves from Bus to Cards. */
  #page-routes .route-bottom-button .route-selected-icon,
  #page-routes .route-card-selected-icon{
    width:27px;height:27px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 27px;
    transition:background-color .18s ease, transform .18s ease;
  }
  #page-routes .route-bottom-button:first-child .route-selected-icon{
    background:#ffda00!important;
  }
  #page-routes .route-bottom-button:first-child .route-selected-icon .nav-icon-bus-image{
    width:20px;height:20px;
  }
  #page-routes .route-card-selected-icon{background:transparent;}
  #page-routes .route-card-selected-icon svg{width:20px;height:20px;display:block;}
  #page-routes .route-cards-button.is-selected .route-card-selected-icon,
  #page-routes .route-bottom-nav.cards-tab-active .route-cards-button .route-card-selected-icon{
    background:#ffda00!important;
  }
  #page-routes .route-bottom-nav.cards-tab-active .route-bottom-button:first-child .route-selected-icon{
    background:transparent!important;
  }
  #page-routes .route-card-selected-icon.is-animating,
  #page-routes .route-bottom-button:first-child .route-selected-icon.is-animating{
    animation:onayTabPop .48s cubic-bezier(.2,.8,.2,1) both;
  }
  #page-routes .route-card-selected-icon.is-animating .nav-icon-cards{
    animation:onayCardTilt .48s cubic-bezier(.2,.8,.2,1) both;
    transform-origin:50% 50%;
  }
  @keyframes onayTabPop{
    0%{transform:scale(.72);opacity:.72;}
    56%{transform:scale(1.13);opacity:1;}
    78%{transform:scale(.97);opacity:1;}
    100%{transform:scale(1);opacity:1;}
  }
  /* The SVG artwork itself is already tilted by 18 degrees; animate only the bounce. */
  @keyframes onayCardTilt{
    0%{transform:rotate(0deg) scale(.86);}
    45%{transform:rotate(10deg) scale(1.07);}
    72%{transform:rotate(-3deg) scale(.98);}
    100%{transform:rotate(0deg) scale(1);}
  }

      let saved='';try{saved=localStorage.getItem(AUTH_LAST_PHONE_KEY)||'';}catch(_){}

      const recent=Object.entries(accounts).filter(([phone,a])=>valid(phone)&&a?.createdAt)

      return recent[0]?.[0]||'';
    }

    function authMaskedPhoneFor(phone){const d=String(phone||'');return d.length===10?`+7${d.slice(0,3)} --- -- ${d.slice(-2)}`:'+7';}
    function authSubmitPhone(){
      if(authBusy)return;const input=el('auth-phone-input');const digits=authDigits(input?.value);
      if(digits.length!==10){authSetError('Қазақстан нөмірінің 10 цифрын толық енгізіңіз.');return;}

      if(clientData.type!=='webauthn.get'||clientData.challenge!==authBytesToBase64Url(challenge)||clientData.origin!==location.origin||clientData.crossOrigin===true)
        throw new Error('Биометриялық сұрау тексеруден өтпеді.');
      const authenticatorData=new Uint8Array(response.authenticatorData);
      if(authenticatorData.length<37)throw new Error('Құрылғы деректері толық емес.');
      const rpHash=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(rpId)));
      if(!authBytesEqual(authenticatorData.slice(0,32),rpHash))throw new Error('Қолданба домені сәйкес келмейді.');
      const flags=authenticatorData[32];
      if(!(flags&0x01)||!(flags&0x04))throw new Error('Құрылғы пайдаланушыны растаған жоқ.');
      const counter=((authenticatorData[33]<<24)|(authenticatorData[34]<<16)|(authenticatorData[35]<<8)|authenticatorData[36])>>>0;
      if(counter&&account.biometricCounter&&counter<=account.biometricCounter)throw new Error('Құрылғы санауышы жарамсыз. PIN-кодты пайдаланыңыз.');
      const clientHash=new Uint8Array(await crypto.subtle.digest('SHA-256',clientDataBytes));
      const signedData=new Uint8Array(authenticatorData.length+clientHash.length);
      signedData.set(authenticatorData);signedData.set(clientHash,authenticatorData.length);
      const publicKey=await crypto.subtle.importKey('spki',authBase64UrlToBytes(account.biometricPublicKey),{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
      const signature=authDerSignatureToRaw(response.signature);
      const valid=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},publicKey,signature,signedData);
      if(!valid)throw new Error('Саусақ ізі / Face ID расталмады. PIN-кодты пайдаланыңыз.');
      if(counter)account.biometricCounter=counter;
      const accounts=authLoadAccounts();accounts[authPendingPhone]=account;authSaveAccounts(accounts);
      authCompleteLogin(account);
    }
    async function authBiometricAction(){
      if(authBusy||authPinInputBlocked)return;
      const account=authLoadAccounts()[authPendingPhone];
      if(!account?.pinSalt||!account?.pinHash){authSetError('Алдымен аккаунтқа PIN-код орнатыңыз.');return;}
      authBusy=true;
      try{
        if(!account.biometricCredentialId||!account.biometricPublicKey)await authEnableBiometric(account);
        else await authBiometricLogin(account);
      }catch(error){
        if(error?.name==='NotAllowedError')authSetError('Биометриялық сұрау тоқтатылды немесе расталмады. Қайта көріңіз не PIN-кодты енгізіңіз.');
        else authSetError(error?.message||'Биометрияны іске қосу мүмкін болмады. PIN-кодты пайдаланыңыз.');
      }finally{authBusy=false;}
    }
    function authCompleteLogin(account){
      authRememberLastPhone(authPendingPhone);
      if(authAfterLogoutPin){
        // Мәзірден шыққаннан кейін PIN немесе биометрия расталса, тіркелу бетіне өтеміз.
        authAfterLogoutPin=false;authPendingPhone='';

    async function authLogin(){
      if(authBusy)return;const pin=String(el('auth-login-pin')?.value||'');if(!/^\d{4}$/.test(pin)){authSetError('4 таңбалы PIN-кодты енгізіңіз.');return;}

      authBusy=true;try{
        const candidate=await authPinHash(pin,authFromBase64(account.pinSalt));const expected=authFromBase64(account.pinHash);
        const matches=candidate.length===expected.length&&candidate.every((value,index)=>value===expected[index]);
        if(!matches){
          authPinInputBlocked=true;authSetError('Код қате. Қайта енгізіңіз.');authRenderPinDots(true);
          clearTimeout(authPinResetTimer);
          authPinResetTimer=setTimeout(()=>{const input=el('auth-login-pin');if(input)input.value='';authPinInputBlocked=false;authRenderPinDots(false);},600);
          return;
        }
        authCompleteLogin(account);

      finally{authBusy=false;}
    }

    function onayFareForCard(index){
      // Tariffs used in this demo: child 60 ₸, unified/adult 120 ₸.
      if(index===0) return 60;
      if(index===1) return 120;
      return null; // Student tariff is not specified in the current prototype requirements.

    function refreshOnayCardDetails(){
      const fallback=cardSlidesData[activeCardIndex]||cardSlidesData.find(card=>card.type==='virtual')||cardSlidesData[0];
      const ledgerIndex=Number.isInteger(fallback?.ledgerIndex)?fallback.ledgerIndex:0;
      const balance=typeof trialLedger!=='undefined' && trialLedger.balances[ledgerIndex]!==undefined
        ? trialLedger.balances[ledgerIndex] : Number(fallback?.balance)||0;
      const balanceNode=document.getElementById('detail-balance');
      const ridesNode=document.querySelector('#onay-card-details .onay-detail-rides');
      if(balanceNode) balanceNode.textContent=String(balance);
      if(ridesNode){
        const fare=onayFareForCard(ledgerIndex);
        if(fare===null){
          ridesNode.textContent='';
          ridesNode.dataset.balanceStatus='normal';
        }else{
          const rides=Math.floor(Math.max(0,Number(balance)||0)/fare);
          ridesNode.textContent=`~${rides} жол жүру, Алматы`;
          ridesNode.dataset.balanceStatus=rides===0?'low':'normal';
        }
      }
    }

    clip-path:none!important;
    background:#f5f5f7!important;
  }
  #onay-card-slider::before,
  #onay-card-slider::after,
  #onay-card-slider.is-last-slide::before,
  #onay-card-slider.is-last-slide::after{
    content:none!important;
    display:none!important;
  }
  #onay-card-track{
    display:flex!important;
    box-sizing:border-box!important;
    width:100%!important;
    gap:3px!important;
    transition:transform .32s ease!important;
    touch-action:pan-y;
  }
  #onay-card-track .onay-card-slide{
    box-sizing:border-box!important;
    flex:0 0 calc(100% - 3px)!important;
    width:calc(100% - 3px)!important;
    min-width:calc(100% - 3px)!important;
    overflow:visible!important;
  }
  /* The inactive card is scaled vertically only, so the preview remains a real card edge. */
  #onay-card-track .onay-card-slide.is-inactive .onay-main-card,
  #onay-card-track .onay-card-slide.is-inactive .onay-add-card-tile{
    transform:scaleY(.82)!important;
    transform-origin:center center!important;
  }
  #onay-card-track .onay-card-slide.is-active .onay-main-card,
  #onay-card-track .onay-card-slide.is-active .onay-add-card-tile{
    transform:scaleY(1)!important;
    transform-origin:center center!important;
  }
  #onay-card-slider .onay-main-card,
  #onay-card-slider .onay-add-card-tile{
    box-sizing:border-box!important;
    width:100%!important;
    height:128px!important;
    min-height:128px!important;
    max-height:128px!important;
    border-radius:16px!important;
  }
  #onay-card-slider .onay-main-card{padding:13px 15px 11px!important;}
  .onay-add-card-slide{display:flex!important;align-items:stretch!important;}
  .onay-add-card-tile{
    padding:8px 10px!important;
    gap:8px!important;
    background:#fff6c6!important;
  }
  .onay-add-card-plus{
    width:52px!important;height:52px!important;
    min-width:52px!important;min-height:52px!important;
    max-width:52px!important;max-height:52px!important;
  }
  .onay-add-card-title{font-size:14px!important;line-height:1.2!important;font-weight:500!important;}
  #onay-card-dots{
    display:flex!important;justify-content:center!important;align-items:center!important;
    gap:10px!important;height:11px!important;min-height:11px!important;
    margin:12px 0 15px!important;padding:0!important;
  }
  #onay-card-dots .onay-dot{
    display:block!important;flex:0 0 10px!important;
    width:10px!important;height:10px!important;min-width:10px!important;
    margin:0!important;padding:0!important;border:0!important;border-radius:50%!important;
    background:#dce0e7!important;box-shadow:none!important;
  }
  #onay-card-dots .onay-dot.active{background:#7bc7ee!important;}
  #onay-card-dots .onay-dot.theme-yellow-active{background:#ffcf00!important;}
  @media(max-width:360px){
    #onay-card-slider{padding-left:13px!important;}
    #onay-card-track .onay-card-slide{
      flex-basis:calc(100% - 3px)!important;
      width:calc(100% - 3px)!important;
      min-width:calc(100% - 3px)!important;
    }
    #onay-card-slider .onay-main-card,
    #onay-card-slider .onay-add-card-tile{
      height:120px!important;min-height:120px!important;max-height:120px!important;
    }
    .onay-add-card-plus{
      width:48px!important;height:48px!important;min-width:48px!important;min-height:48px!important;
      max-width:48px!important;max-height:48px!important;
    }
    .onay-add-card-title{font-size:13px!important;}
  }
</style>
