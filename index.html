<!doctype html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fc">
  <title>Сәлем! | ONAY</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(145deg, #f7f9ff, #eaf0ff);
      color: #17243b;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100%, 440px);
      padding: 42px 28px;
      text-align: center;
      background: #fff;
      border: 1px solid #e5eaf4;
      border-radius: 28px;
      box-shadow: 0 22px 65px rgba(30, 55, 100, .10);
    }
    .logo {
      width: 66px;
      height: 66px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 21px;
      background: #eaf1ff;
      color: #1769e0;
      font-size: 30px;
      font-weight: 800;
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 10vw, 58px);
      letter-spacing: -2px;
    }
    p {
      margin: 14px 0 0;
      color: #6b7890;
      font-size: 16px;
      line-height: 1.6;
    }
    .domain {
      margin-top: 24px;
      color: #9aa5b8;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">O</div>
    <h1>Сәлем!</h1>
    <p>ONAY сайтына қош келдіңіз.</p>
    <div class="domain">ONAY • onay-kz.pages.dev</div>
  </main>
</body>
</html>
