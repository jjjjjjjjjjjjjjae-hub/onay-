plugins { id 'com.android.application' }

// AndroidX Biometric and WebKit can request different Kotlin stdlib module
// versions. Keep the JDK7/JDK8 compatibility modules aligned so AGP does not
// package duplicate Kotlin classes into the APK.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion '1.8.22'
        }
    }
}

def appVersionCodeValue = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()
def appVersionNameValue = (project.findProperty('appVersionName') ?: '1.0-demo').toString()
def signingStorePath = (project.findProperty('signingStoreFile') ?: "${rootProject.projectDir}/missing-release-key.jks").toString()

android {
    namespace 'kz.onay'
    compileSdk 35

    defaultConfig {
        applicationId 'kz.onay'
        minSdk 24
        targetSdk 35
        versionCode appVersionCodeValue
        versionName appVersionNameValue
    }

    signingConfigs {
        release {
            storeFile file(signingStorePath)
            storePassword project.findProperty('signingStorePassword') ?: ''
            keyAlias project.findProperty('signingKeyAlias') ?: ''
            keyPassword project.findProperty('signingKeyPassword') ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.18.0'
}
