name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'ONAY_ticket_valid_blue_expired_grayscale.html'
      - 'device-pairing.js'
      - 'image.png'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-debug.yml'

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Prepare HTML and launcher icon
        run: |
          test -s ONAY_ticket_valid_blue_expired_grayscale.html
          test -s device-pairing.js
          test -s image.png
          mkdir -p app/src/main/assets app/src/main/res/drawable-nodpi
          cp ONAY_ticket_valid_blue_expired_grayscale.html app/src/main/assets/index.html
          cp device-pairing.js app/src/main/assets/device-pairing.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/assets/index.html')
          text = path.read_text(encoding='utf-8')
          marker = '</body>'
          if marker not in text:
              raise SystemExit('index.html has no closing body tag')
          path.write_text(text.replace(marker, '<script src="device-pairing.js"></script>' + marker, 1), encoding='utf-8')
          PY
          cp image.png app/src/main/res/drawable-nodpi/ic_launcher.png

      - name: Build debug APK
        run: |
          gradle --no-daemon :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ONAY-Demo-debug.apk
          test -s dist/ONAY-Demo-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: onay-demo-debug-apk
          path: dist/ONAY-Demo-debug.apk
          if-no-files-found: error
          retention-days: 30

