name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ONAY_ticket_valid_blue_expired_grayscale.html'
      - 'device-pairing.js'
      - 'image.png'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: onay-demo-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore and validate release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ONAY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ONAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ONAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ONAY_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=("ONAY_KEYSTORE_BASE64")
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=("ONAY_KEYSTORE_PASSWORD")
          [ -n "$KEY_ALIAS" ] || missing+=("ONAY_KEY_ALIAS")
          [ -n "$KEY_PASSWORD" ] || missing+=("ONAY_KEY_PASSWORD")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing repository Actions secret(s): %s\n' "${missing[*]}"
            echo "Add them under Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/onay-demo-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ONAY_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Prepare HTML and launcher icon
        run: |
          test -s ONAY_ticket_valid_blue_expired_grayscale.html
          test -s device-pairing.js
          test -s image.png
          mkdir -p app/src/main/assets app/src/main/res/drawable-nodpi
          cp ONAY_ticket_valid_blue_expired_grayscale.html app/src/main/assets/index.html
          cp device-pairing.js app/src/main/assets/device-pairing.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/assets/index.html')
          text = path.read_text(encoding='utf-8')
          marker = '</body>'
          if marker not in text:
              raise SystemExit('index.html has no closing body tag')
          path.write_text(text.replace(marker, '<script src="device-pairing.js"></script>' + marker, 1), encoding='utf-8')
          PY
          cp image.png app/src/main/res/drawable-nodpi/ic_launcher.png
          cp image.png app/src/main/res/drawable-nodpi/ic_launcher_foreground.png

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ONAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ONAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ONAY_KEY_PASSWORD }}
        run: |
          # The updater reads the trailing number in v1.0.N and compares it
          # with Android versionCode, so both values must stay identical.
          VERSION_CODE="$GITHUB_RUN_NUMBER"
          VERSION_NAME="1.0.$GITHUB_RUN_NUMBER"

          gradle --no-daemon :app:assembleRelease \
            -PappVersionCode="$VERSION_CODE" \
            -PappVersionName="$VERSION_NAME" \
            -PsigningStoreFile="$ONAY_KEYSTORE_FILE" \
            -PsigningStorePassword="$KEYSTORE_PASSWORD" \
            -PsigningKeyAlias="$KEY_ALIAS" \
            -PsigningKeyPassword="$KEY_PASSWORD"

          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ONAY-Demo.apk

      - name: Verify APK signature
        run: |
          APK="dist/ONAY-Demo.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: onay-demo-release-apk
          path: dist/ONAY-Demo.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ONAY Demo v1.0.${{ github.run_number }}
          body: |
            ONAY Demo Android release.

            APK signature verified by GitHub Actions.
            Update installs over the existing app when it uses the same release signing key.
            Android still asks the user to confirm installation.
          make_latest: true
          files: dist/ONAY-Demo.apk
          fail_on_unmatched_files: true

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/onay-demo-release.jks"

